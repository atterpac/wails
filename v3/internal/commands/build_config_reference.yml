# Wails v3 typed build configuration reference.
#
# Generated by: wails3 build --config-export
#
# This file is safe to inspect as-is. Copy the settings you want into
# build/config.yml. An empty stage mapping (`stage.name: {}`) selects the Wails
# default implementation. Only uncomment stages that you want to customise.
#
# Inspect the result before execution:
#   wails3 build --plan
#   wails3 build --plan --json
#   wails3 build step native.compile --plan

version: '3'

build:
  # Output and target defaults. CLI --target and --format values take precedence.
  # binaryName: my-application
  # output: bin
  # tags: [production-extra]
  # targets:
  #   - platform: linux
  #     arch: amd64
  #   - platform: windows
  #     arch: amd64
  # packages:
  #   - format: deb

  # frontend:
  #   directory: frontend
  #   packageManager: npm
  #   output: frontend/dist

  # Keep this mapping empty until you choose a stage to customise. Every built-in
  # stage is listed below. Uncommenting `stage.name: {}` keeps its default behaviour.
  stages:

  # project.resolve: Read project configuration and initialise the build workspace.
  #   project.resolve: {}

  # toolchain.check: Verify required tools for each selected target.
  #   toolchain.check: {}

  # dependencies.prepare: Prepare Go modules and frontend dependencies.
  #   dependencies.prepare:
  #     settings:
  #       goModules: download       # none, validate, download, or tidy
  #       frontend: install-if-needed # none, install, or install-if-needed

  # bindings.generate: Generate JavaScript or TypeScript frontend bindings.
  #   bindings.generate: {}

  # assets.generate: Generate target-specific icons and application assets.
  #   assets.generate: {}

  # frontend.build: Install dependencies and build the frontend distribution.
  #   frontend.build:
  #     settings:
  #       directory: frontend
  #       packageManager: pnpm
  #       install:
  #         command: [pnpm, install, --frozen-lockfile]
  #       build:
  #         command: [pnpm, run, build]
  #       output: frontend/dist
  #       environment:
  #         PUBLIC_BUILD_MODE: release

  # platform.generate: Generate manifests, plists, and mobile platform metadata.
  #   platform.generate:
  #     settings:
  #       overlays:
  #         windows:
  #           manifest: build/windows/custom.manifest
  #         darwin:
  #           plist: build/darwin/Info.custom.plist

  # native.compile: Compile the desktop executable, server, Android library, or iOS archive.
  #   native.compile:
  #     settings:
  #       tags: [enterprise]
  #       trimPath: true
  #       vcsInfo: false
  #     matrix:
  #       exclude:
  #         - platform: windows
  #           arch: arm64

  # binary.combine: Combine multiple macOS architectures into a universal binary.
  #   binary.combine: {}

  # bundle.assemble: Create a runnable .app, AppDir, Windows layout, or mobile bundle.
  #   bundle.assemble: {}

  # bundle.sign: Sign a runnable application before packaging when requested.
  #   bundle.sign: {}

  # package.create: Create the selected installer or distribution package.
  #   package.create: {}

  # package.sign: Sign a finished package when the format requires it.
  #   package.sign: {}

  # package.notarize: Submit Apple output for notarization and staple the ticket.
  #   package.notarize: {}

  # artifacts.collect: Verify outputs, hash them, and write bin/artifacts.json.
  #   artifacts.collect: {}

  # All stages accept before/after hooks. Add this beneath one stage entry:
  #   bundle.assemble:
  #     after:
  #       - name: add-license
  #         command: [./scripts/add-license, "${artifacts.bundle}"]
  #         workingDirectory: "${project.root}"
  #         scope: target          # stage, build, target, architecture, or package
  #         when:
  #           mode: production
  #           platform: [darwin, linux]
  #         inputs:
  #           bundle: "${artifacts.bundle}"
  #         outputs:
  #           licenseStamp: bin/${target.platform}/${target.arch}/license.stamp
  #         cache:
  #           files: [LICENSE, scripts/add-license]
  #           environment: [LICENSE_VARIANT]
  #         timeout: 30s
  #         onFailure: fail        # fail or continue

  # Replace a whole stage with a project command. Every required built-in output
  # must be declared under produces.
  #   native.compile:
  #     replace:
  #       command: [./scripts/build-native]
  #       workingDirectory: "${project.root}"
  #       produces:
  #         binary: bin/${target.platform}/${target.arch}/my-application

  # For complete graph ownership use build.pipeline instead of build.stages.
  # The two forms are mutually exclusive.
  # pipeline:
  #   frontend:
  #     uses: wails/frontend.build
  #     produces:
  #       frontend: frontend/dist
  #   compile:
  #     uses: wails/native.compile
  #     needs: [frontend]
  #     produces:
  #       binary: bin/${target.platform}/${target.arch}/my-application
  #   upload-symbols:
  #     run: [./scripts/upload-symbols]
  #     needs: [compile]
  #     sources: [scripts/upload-symbols]
  #     timeout: 2m
